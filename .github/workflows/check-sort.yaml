name: Config Sort Check

on:
  workflow_run:
    workflows:
      - AquaMai Build
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  check-sort:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download check input
        uses: actions/download-artifact@v4
        with:
          name: config-sort-check-input
          path: check-input
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Check config sort
        working-directory: check-input
        run: |
          mkdir -p Output
          mv Output/Upload/AquaMai.zh.toml Output/AquaMai.zh.toml
          python checkSort.py
